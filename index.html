// 可搜索的玩家下拉选择（按姓名 / 玩家编号 / 电话搜索）
function PlayerSearchSelect({ players, value, onChange, placeholder = "请选择玩家" }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const boxRef = React.useRef(null);

  const selected = players.find((p) => p.id === value);

  React.useEffect(() => {
    const onClickOutside = (e) => {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);

  const filtered = players.filter((p) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return (
      p.name.toLowerCase().includes(q) ||
      p.code.toLowerCase().includes(q) ||
      (p.phone || "").toLowerCase().includes(q)
    );
  });

  return (
    <div className="relative" ref={boxRef}>
      <button
        type="button"
        onClick={() => { setOpen((o) => !o); setQuery(""); }}
        className={inputCls + " flex items-center justify-between text-left"}
      >
        <span className={selected ? "text-slate-800" : "text-slate-400"}>
          {selected ? `${selected.name}（${selected.code}）` : placeholder}
        </span>
        <ChevronRight size={14} className={`text-slate-400 transition-transform ${open ? "rotate-90" : ""}`} />
      </button>

      {open && (
        <div className="absolute z-40 mt-1.5 w-full bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
          <div className="p-2 border-b border-slate-100">
            <div className="relative">
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
              <input
                autoFocus
                className={inputCls + " pl-9 py-2"}
                placeholder="搜索玩家姓名 / 编号 / 电话"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
            </div>
          </div>
          <div className="max-h-56 overflow-y-auto">
            <button
              type="button"
              onClick={() => { onChange(""); setOpen(false); }}
              className={`w-full text-left px-3.5 py-2.5 text-sm ${!value ? "bg-emerald-50 text-emerald-700 font-medium" : "text-slate-500 hover:bg-slate-50"}`}
            >
              请选择玩家
            </button>
            {filtered.map((p) => (
              <button
                type="button"
                key={p.id}
                onClick={() => { onChange(p.id); setOpen(false); }}
                className={`w-full text-left px-3.5 py-2.5 text-sm flex items-center justify-between ${p.id === value ? "bg-emerald-50 text-emerald-700 font-medium" : "text-slate-700 hover:bg-slate-50"}`}
              >
                <span>{p.name} <span className="text-slate-400 font-mono text-xs">（{p.code}）</span></span>
                {p.id === value && <Check size={14} />}
              </button>
            ))}
            {filtered.length === 0 && (
              <div className="px-3.5 py-6 text-center text-xs text-slate-400">没有找到符合的玩家</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const tryLogin = async () => {
    if (!username || !password) {
      setError("请输入账号和密码");
      return;
    }
    setLoading(true);
    setError("");

    const internalEmail = `${username}@wems.internal`;
    const { data, error: signInError } = await supabase.auth.signInWithPassword({
      email: internalEmail,
      password,
    });

    if (signInError) {
      setLoading(false);
      setError("账号或密码不正确，请重新输入");
      return;
    }

    const meta = data.user.user_metadata || {};
    const role = meta.role === "boss" ? "boss" : "agent";
    let name = meta.username || username;

    // 代理身份要去数据库把真实姓名读出来（RLS 只允许读自己那条）
    if (role === "agent" && meta.agent_id) {
      const { data: agentRow } = await supabase
        .from("agents")
        .select("name")
        .eq("id", meta.agent_id)
        .maybeSingle();
      if (agentRow?.name) name = agentRow.name;
    }

    setLoading(false);
    onLogin({
      role,
      agentId: meta.agent_id || null,
      name: role === "boss" ? "老板" : name,
      username,
      accessToken: data.session.access_token,
    });
  };

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-5">
      <div className="w-full max-w-sm">
        <div className="text-center mb-7">
          <div className="font-mono font-extrabold text-3xl text-emerald-700 tracking-tight">WEMS</div>
          <div className="text-sm text-slate-400 mt-1">代理输赢报表系统</div>
        </div>

        <div className="bg-white rounded-2xl border border-slate-100 p-6 shadow-sm">
          <Field label="登录账号">
            <input className={inputCls} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="请输入账号" />
          </Field>
          <Field label="密码">
            <input
              type="password"
              className={inputCls}
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="请输入密码"
              onKeyDown={(e) => e.key === "Enter" && tryLogin()}
            />
          </Field>
          {error ? <div className="text-red-500 text-xs mb-3 -mt-1">{error}</div> : null}
          <button
            onClick={tryLogin}
            disabled={loading}
            className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-semibold py-3 rounded-xl text-sm"
          >
            {loading ? "登录中…" : "登录"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Dashboard({ agents, transactions, expenses, user, netOf, commissionOf, visibleTransactions, setView }) {
  const [date, setDate] = useState(todayStr());

  const dayTx = useMemo(() => visibleTransactions.filter((t) => t.date === date), [visibleTransactions, date]);
  const dayExpenses = useMemo(() => expenses.filter((e) => e.date === date), [expenses, date]);

  const totals = useMemo(() => {
    const inSum = dayTx.reduce((s, t) => s + Number(t.inAmount), 0);
    const outSum = dayTx.reduce((s, t) => s + Number(t.outAmount), 0);
    const focSum = dayTx.reduce((s, t) => s + Number(t.foc), 0);
    const netSum = dayTx.reduce((s, t) => s + netOf(t), 0);
    const expSum = dayExpenses.reduce((s, e) => s + Number(e.amount), 0);
    const playerCount = new Set(dayTx.map((t) => t.playerId)).size;
    const commissionSum = user.role === "boss"
      ? agents.reduce((s, a) => {
          const list = dayTx.filter((t) => t.agentId === a.id);
          const net = list.reduce((sum, t) => sum + netOf(t), 0);
          return s + commissionOf(a.id, net);
        }, 0)
      : 0;
    return { inSum, outSum, focSum, netSum, expSum, commissionSum, playerCount, txCount: dayTx.length, companyNet: netSum - commissionSum - expSum };
  }, [dayTx, dayExpenses]);

  const perAgent = useMemo(() => {
    if (user.role !== "boss") return [];
    return agents.map((a) => {
      const list = dayTx.filter((t) => t.agentId === a.id);
      const net = list.reduce((s, t) => s + netOf(t), 0);
      const commission = commissionOf(a.id, net);
      return { agent: a, net, commission, bossNet: net - commission, count: list.length, players: new Set(list.map((t) => t.playerId)).size };
    });
  }, [agents, dayTx]);

  const trend = useMemo(() => {
    const out = [];
    for (let d = 6; d >= 0; d--) {
      const day = daysAgo(d);
      const list = visibleTransactions.filter((t) => t.date === day);
      out.push({ day, net: list.reduce((s, t) => s + netOf(t), 0) });
    }
    return out;
  }, [visibleTransactions]);

  const maxAbs = Math.max(1, ...trend.map((d) => Math.abs(d.net)));
  const recent = [...dayTx].sort((a, b) => (a.time < b.time ? 1 : -1)).slice(0, 6);

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h1 className="text-lg font-bold text-slate-800">
          {user.role === "boss" ? "公司每日总览" : `${user.name} 的每日总览`}
        </h1>
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={inputCls + " max-w-[170px]"} />
      </div>

      {/* 顶部账单式总结条 */}
      <div className="bg-white rounded-2xl border border-slate-100 p-5">
        <div className="grid grid-cols-2 sm:grid-cols-4 divide-x divide-y sm:divide-y-0 divide-slate-100">
          <SummaryCell label="进款" value={fmt(totals.inSum)} tone="slate" />
          <SummaryCell label="赢款" value={fmt(totals.outSum)} tone="slate" />
          <SummaryCell label="FOC" value={fmt(totals.focSum)} tone="orange" />
          <SummaryCell label={user.role === "boss" ? "全部代理净输赢" : "我的净输赢"} value={totals.netSum} isNet tone="net" />
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <StatCard label="玩家数量" value={totals.playerCount} tone="sky" icon={Users} />
        <StatCard label="账目数量" value={totals.txCount} tone="slate" icon={List} />
        {user.role === "boss" && <StatCard label="老板开销" value={fmt(totals.expSum)} tone="orange" icon={Wallet} />}
        {user.role === "boss" && <StatCard label="代理佣金" value={fmt(totals.commissionSum)} tone="orange" icon={Wallet} />}
        {user.role === "boss" && (
          <StatCard
            label="公司净结果"
            value={(totals.companyNet >= 0 ? "+" : "") + fmt(totals.companyNet)}
            tone={totals.companyNet >= 0 ? "green" : "red"}
            icon={totals.companyNet >= 0 ? TrendingUp : TrendingDown}
            sub={totals.companyNet >= 0 ? "公司赢" : "公司输"}
          />
        )}
      </div>

      {/* 快捷按钮 */}
      <div>
        <div className="text-xs font-semibold text-slate-400 mb-2">快捷操作</div>
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
          <QuickBtn label="快速记一笔" icon={PlusCircle} onClick={() => setView("entry")} />
          <QuickBtn label="新增玩家" icon={Users} onClick={() => setView("players")} />
          <QuickBtn label="查看流水" icon={List} onClick={() => setView("transactions")} />
          {user.role === "boss" && <QuickBtn label="代理输赢" icon={BarChart3} onClick={() => setView("agentReport")} />}
          {user.role === "boss" && <QuickBtn label="记录开销" icon={Wallet} onClick={() => setView("expenses")} />}
        </div>
      </div>

      {/* 代理汇总（老板） */}
      {user.role === "boss" && (
        <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
          <div className="px-4 py-3 border-b border-slate-100 font-semibold text-sm text-slate-700">各代理今日汇总</div>
          <div className="divide-y divide-slate-100">
            {perAgent.map((row) => (
              <div key={row.agent.id} className="flex items-center justify-between px-4 py-3">
                <div>
                  <div className="text-sm font-medium text-slate-800">{row.agent.name}</div>
                  <div className="text-xs text-slate-400">
                    {row.players} 位玩家 · {row.count} 笔 · 抽成 {row.agent.commissionRate ?? 0}%
                  </div>
                </div>
                <div className="text-right">
                  <NetAmount value={row.net} />
                  <div className="text-[11px] text-slate-400 mt-0.5">
                    佣金 {fmt(row.commission)} · 老板实收 {fmt(row.bossNet)}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 7天趋势 */}
      <div className="bg-white rounded-2xl border border-slate-100 p-4">
        <div className="font-semibold text-sm text-slate-700 mb-4">最近 7 天输赢趋势</div>
        <div className="flex items-end justify-between gap-2 h-28">
          {trend.map((d) => {
            const h = Math.max(4, (Math.abs(d.net) / maxAbs) * 90);
            return (
              <div key={d.day} className="flex-1 flex flex-col items-center justify-end gap-1">
                <div
                  className={`w-full rounded-md ${d.net >= 0 ? "bg-green-400" : "bg-red-400"}`}
                  style={{ height: `${h}px` }}
                  title={fmt(d.net)}
                />
                <span className="text-[9px] text-slate-400">{d.day.slice(5)}</span>
              </div>
            );
          })}
        </div>
      </div>

      {/* 最近账目 */}
      <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 font-semibold text-sm text-slate-700">当天最近账目</div>
        {recent.length === 0 ? (
          <div className="px-4 py-8 text-center text-sm text-slate-400">今天还没有记录，点击「快速记一笔」开始</div>
        ) : (
          <div className="divide-y divide-slate-100">
            {recent.map((t) => (
              <div key={t.id} className="flex items-center justify-between px-4 py-3 text-sm">
                <div>
                  <span className="text-slate-700 font-medium">{t.time}</span>
                  <span className="text-slate-400 ml-2">进 {fmt(t.inAmount)} · 赢 {fmt(t.outAmount)}</span>
                </div>
                <NetAmount value={netOf(t)} size="sm" />
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function EntryForm({ agents, players, setTransactions, user, flash, netOf }) {
  const blank = () => ({
    date: todayStr(),
    time: nowTime(),
    agentId: user.role === "agent" ? user.agentId : agents[0]?.id || "",
    playerId: "",
    inAmount: 0,
    outAmount: 0,
    foc: 0,
    bank: PAYMENT_METHODS[0],
    remark: "",
    agentVisible: true,
  });
  const [form, setForm] = useState(blank());

  const agentPlayers = players.filter((p) => p.agentId === form.agentId);
  const net = Number(form.inAmount || 0) - Number(form.outAmount || 0) - Number(form.foc || 0);

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const save = (keepGoing) => {
    if (!form.agentId || !form.playerId) {
      flash("请先选择代理和玩家");
      return;
    }
    const record = { ...form, id: uid("T"), createdBy: user.role === "boss" ? "老板" : user.name, createdAt: `${form.date} ${form.time}` };
    setTransactions((list) => [record, ...list]);
    flash("保存成功");
    if (keepGoing) {
      setForm({ ...blank(), agentId: form.agentId });
    } else {
      setForm(blank());
    }
  };

  return (
    <div className="max-w-lg space-y-5">
      <h1 className="text-lg font-bold text-slate-800">玩家进出款录入</h1>

      <div className="bg-white rounded-2xl border border-slate-100 p-5">
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="日期">
            <input type="date" className={inputCls} value={form.date} onChange={(e) => set("date", e.target.value)} />
          </Field>
          <Field label="时间">
            <input type="time" className={inputCls} value={form.time} onChange={(e) => set("time", e.target.value)} />
          </Field>
        </div>

        <Field label="代理">
          {user.role === "boss" ? (
            <select className={inputCls} value={form.agentId} onChange={(e) => { set("agentId", e.target.value); set("playerId", ""); }}>
              {agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          ) : (
            <div className={inputCls + " bg-slate-50 text-slate-500"}>{user.name}（当前代理）</div>
          )}
        </Field>

        <Field label="玩家">
          <PlayerSearchSelect players={agentPlayers} value={form.playerId} onChange={(id) => set("playerId", id)} />
        </Field>

        <div className="grid grid-cols-3 gap-x-3">
          <Field label="进款 IN">
            <input type="number" inputMode="decimal" className={inputCls} value={form.inAmount} onChange={(e) => set("inAmount", e.target.value)} />
          </Field>
          <Field label="赢款 OUT">
            <input type="number" inputMode="decimal" className={inputCls} value={form.outAmount} onChange={(e) => set("outAmount", e.target.value)} />
          </Field>
          <Field label="FOC">
            <input type="number" inputMode="decimal" className={inputCls} value={form.foc} onChange={(e) => set("foc", e.target.value)} />
          </Field>
        </div>

        <Field label="银行 / 付款方式">
          <select className={inputCls} value={form.bank} onChange={(e) => set("bank", e.target.value)}>
            {PAYMENT_METHODS.map((b) => <option key={b}>{b}</option>)}
          </select>
        </Field>

        <Field label="备注（选填）">
          <input className={inputCls} value={form.remark} onChange={(e) => set("remark", e.target.value)} placeholder="备注" />
        </Field>

        {user.role === "boss" && (
          <label className="flex items-center gap-2 mb-4 text-sm text-slate-600">
            <input type="checkbox" checked={form.agentVisible} onChange={(e) => set("agentVisible", e.target.checked)} className="w-4 h-4 accent-emerald-600" />
            允许代理查看这笔账目
          </label>
        )}

        <div className="bg-slate-50 rounded-xl p-4 flex items-center justify-between mb-4">
          <span className="text-sm font-medium text-slate-500">本单净输赢</span>
          <NetAmount value={net} size="lg" />
        </div>

        <div className="grid grid-cols-2 gap-2.5">
          <button onClick={() => save(false)} className="bg-slate-100 text-slate-700 font-semibold py-3 rounded-xl text-sm">保存</button>
          <button onClick={() => save(true)} className="bg-emerald-600 text-white font-semibold py-3 rounded-xl text-sm">保存并继续下一笔</button>
        </div>
      </div>
    </div>
  );
}

function TransactionList({ agents, players, transactions, setTransactions, user, flash, netOf, visibleTransactions }) {
  const [filters, setFilters] = useState({ start: "", end: "", agentId: "", playerId: "", keyword: "" });
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const base = user.role === "boss" ? transactions : visibleTransactions;

  const filtered = useMemo(() => {
    return base.filter((t) => {
      if (filters.start && t.date < filters.start) return false;
      if (filters.end && t.date > filters.end) return false;
      if (filters.agentId && t.agentId !== filters.agentId) return false;
      if (filters.playerId && t.playerId !== filters.playerId) return false;
      if (filters.keyword) {
        const p = players.find((pl) => pl.id === t.playerId);
        const hay = `${p?.name || ""} ${p?.phone || ""} ${t.bank} ${t.remark}`.toLowerCase();
        if (!hay.includes(filters.keyword.toLowerCase())) return false;
      }
      return true;
    }).sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : -1));
  }, [base, filters, players]);

  const totals = useMemo(() => {
    const inSum = filtered.reduce((s, t) => s + Number(t.inAmount), 0);
    const outSum = filtered.reduce((s, t) => s + Number(t.outAmount), 0);
    const focSum = filtered.reduce((s, t) => s + Number(t.foc), 0);
    const netSum = filtered.reduce((s, t) => s + netOf(t), 0);
    return { inSum, outSum, focSum, netSum, players: new Set(filtered.map((t) => t.playerId)).size };
  }, [filtered]);

  const agentName = (id) => agents.find((a) => a.id === id)?.name || "-";
  const playerName = (id) => players.find((p) => p.id === id)?.name || "-";

  const exportCSV = () => {
    const header = ["日期", "时间", "代理", "玩家", "进款", "赢款", "FOC", "净输赢", "付款方式", "备注"];
    const rows = filtered.map((t) => [t.date, t.time, agentName(t.agentId), playerName(t.playerId), t.inAmount, t.outAmount, t.foc, netOf(t), t.bank, t.remark]);
    const csv = [header, ...rows].map((r) => r.join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `玩家流水_${todayStr()}.csv`;
    link.click();
    flash("CSV 导出成功（模拟）");
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h1 className="text-lg font-bold text-slate-800">玩家流水</h1>
        <button onClick={exportCSV} className="text-xs font-semibold bg-slate-800 text-white px-3.5 py-2 rounded-lg">导出 CSV</button>
      </div>

      {/* 筛选 */}
      <div className="bg-white rounded-2xl border border-slate-100 p-4 grid grid-cols-2 sm:grid-cols-5 gap-2.5">
        <input type="date" className={inputCls} value={filters.start} onChange={(e) => setFilters((f) => ({ ...f, start: e.target.value }))} />
        <input type="date" className={inputCls} value={filters.end} onChange={(e) => setFilters((f) => ({ ...f, end: e.target.value }))} />
        {user.role === "boss" && (
          <select className={inputCls} value={filters.agentId} onChange={(e) => setFilters((f) => ({ ...f, agentId: e.target.value }))}>
            <option value="">全部代理</option>
            {agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        )}
        <div className="relative sm:col-span-2 col-span-2">
          <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls + " pl-9"} placeholder="搜索玩家/银行/备注" value={filters.keyword} onChange={(e) => setFilters((f) => ({ ...f, keyword: e.target.value }))} />
        </div>
      </div>

      {/* 汇总条 */}
      <div className="bg-white rounded-2xl border border-slate-100 p-4 grid grid-cols-3 sm:grid-cols-5 gap-3 text-center">
        <MiniStat label="进款" value={fmt(totals.inSum)} />
        <MiniStat label="赢款" value={fmt(totals.outSum)} />
        <MiniStat label="FOC" value={fmt(totals.focSum)} tone="orange" />
        <MiniStat label="净输赢" value={<NetAmount value={totals.netSum} />} raw />
        <MiniStat label="账目数" value={filtered.length} />
      </div>

      {/* 表格 */}
      <div className="bg-white rounded-2xl border border-slate-100 overflow-x-auto">
        <table className="w-full text-sm min-w-[720px]">
          <thead>
            <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
              <th className="px-4 py-3 font-medium">日期/时间</th>
              {user.role === "boss" && <th className="px-4 py-3 font-medium">代理</th>}
              <th className="px-4 py-3 font-medium">玩家</th>
              <th className="px-4 py-3 font-medium">进款</th>
              <th className="px-4 py-3 font-medium">赢款</th>
              <th className="px-4 py-3 font-medium">FOC</th>
              <th className="px-4 py-3 font-medium">净输赢</th>
              <th className="px-4 py-3 font-medium">付款方式</th>
              <th className="px-4 py-3 font-medium">操作</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {filtered.map((t) => (
              <tr key={t.id} className="hover:bg-slate-50/60">
                <td className="px-4 py-3 whitespace-nowrap text-slate-500">{t.date} {t.time}</td>
                {user.role === "boss" && <td className="px-4 py-3">{agentName(t.agentId)}</td>}
                <td className="px-4 py-3 font-medium">{playerName(t.playerId)}</td>
                <td className="px-4 py-3 font-mono">{fmt(t.inAmount)}</td>
                <td className="px-4 py-3 font-mono">{fmt(t.outAmount)}</td>
                <td className="px-4 py-3 font-mono text-orange-600">{fmt(t.foc)}</td>
                <td className="px-4 py-3"><NetAmount value={netOf(t)} size="sm" /></td>
                <td className="px-4 py-3 text-slate-500">{t.bank}</td>
                <td className="px-4 py-3">
                  <div className="flex items-center gap-2">
                    <button onClick={() => setEditing(t)} className="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200"><Edit2 size={13} /></button>
                    <button onClick={() => setConfirmDelete(t)} className="p-1.5 rounded-lg bg-red-50 text-red-500 hover:bg-red-100"><Trash2 size={13} /></button>
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan={9} className="px-4 py-10 text-center text-slate-400">没有符合条件的记录</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {editing && (
        <EditTransactionModal
          tx={editing}
          agents={agents}
          players={players}
          onClose={() => setEditing(null)}
          onSave={(updated) => {
            setTransactions((list) => list.map((t) => (t.id === updated.id ? updated : t)));
            setEditing(null);
            flash("修改成功，报表已重新计算");
          }}
        />
      )}

      {confirmDelete && (
        <Modal title="确认删除" onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-600 mb-5">
            确定要删除 <b>{playerName(confirmDelete.playerId)}</b> 在 {confirmDelete.date} {confirmDelete.time} 的这笔账目吗？删除后无法恢复。
          </p>
          <div className="grid grid-cols-2 gap-2.5">
            <button onClick={() => setConfirmDelete(null)} className="bg-slate-100 text-slate-700 font-semibold py-2.5 rounded-xl text-sm">取消</button>
            <button
              onClick={() => {
                setTransactions((list) => list.filter((t) => t.id !== confirmDelete.id));
                setConfirmDelete(null);
                flash("已删除，汇总数据已更新");
              }}
              className="bg-red-500 text-white font-semibold py-2.5 rounded-xl text-sm"
            >
              确认删除
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function MiniStat({ label, value, tone, raw }) {
  return (
    <div>
      <div className="text-[11px] text-slate-400 mb-1">{label}</div>
      {raw ? value : <div className={`font-mono font-bold text-sm ${tone === "orange" ? "text-orange-600" : "text-slate-800"}`}>{value}</div>}
    </div>
  );
}

  const agentPlayers = players.filter((p) => p.agentId === form.agentId);

  return (
    <Modal title="修改账目" onClose={onClose}>
      <div className="grid grid-cols-2 gap-x-3">
        <Field label="日期"><input type="date" className={inputCls} value={form.date} onChange={(e) => set("date", e.target.value)} /></Field>
        <Field label="时间"><input type="time" className={inputCls} value={form.time} onChange={(e) => set("time", e.target.value)} /></Field>
      </div>
      <Field label="代理">
        <select className={inputCls} value={form.agentId} onChange={(e) => set("agentId", e.target.value)}>
          {agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
      </Field>
      <Field label="玩家">
        <PlayerSearchSelect players={agentPlayers} value={form.playerId} onChange={(id) => set("playerId", id)} />
      </Field>
      <div className="grid grid-cols-3 gap-x-3">
        <Field label="进款"><input type="number" className={inputCls} value={form.inAmount} onChange={(e) => set("inAmount", e.target.value)} /></Field>
        <Field label="赢款"><input type="number" className={inputCls} value={form.outAmount} onChange={(e) => set("outAmount", e.target.value)} /></Field>
        <Field label="FOC"><input type="number" className={inputCls} value={form.foc} onChange={(e) => set("foc", e.target.value)} /></Field>
      </div>
      <div className="bg-slate-50 rounded-xl p-4 flex items-center justify-between mb-4">
        <span className="text-sm font-medium text-slate-500">净输赢</span>
        <NetAmount value={net} />
      </div>
      <button onClick={() => onSave(form)} className="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl text-sm">保存修改</button>
    </Modal>
  );
}

// ---------------------------------------------------------------------------
function PlayerManagement({ agents, players, setPlayers, transactions, user, flash, netOf, visiblePlayers }) {
  const [keyword, setKeyword] = useState("");
  const [agentFilter, setAgentFilter] = useState("");
  const [editing, setEditing] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [detail, setDetail] = useState(null);

  const base = user.role === "boss" ? players : visiblePlayers;
  const list = base.filter((p) => {
    if (agentFilter && p.agentId !== agentFilter) return false;
    if (keyword) {
      const hay = `${p.name} ${p.phone} ${p.bankName} ${p.bankAccount}`.toLowerCase();
      if (!hay.includes(keyword.toLowerCase())) return false;
    }
    return true;
  });

  const agentName = (id) => agents.find((a) => a.id === id)?.name || "-";

  const statTone = { 正常: "green", 暂停: "amber", 黑名单: "red", 已关闭: "slate" };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h1 className="text-lg font-bold text-slate-800">玩家资料管理</h1>
        <button onClick={() => setShowAdd(true)} className="text-xs font-semibold bg-emerald-600 text-white px-3.5 py-2 rounded-lg flex items-center gap-1.5">
          <PlusCircle size={14} /> 新增玩家
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 p-4 flex flex-col sm:flex-row gap-2.5">
        <div className="relative flex-1">
          <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls + " pl-9"} placeholder="搜索姓名 / 电话 / 银行" value={keyword} onChange={(e) => setKeyword(e.target.value)} />
        </div>
        {user.role === "boss" && (
          <select className={inputCls + " sm:max-w-[160px]"} value={agentFilter} onChange={(e) => setAgentFilter(e.target.value)}>
            <option value="">全部代理</option>
            {agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        )}
      </div>

      <div className="grid sm:grid-cols-2 gap-3">
        {list.map((p) => {
          const txs = transactions.filter((t) => t.playerId === p.id);
          const net = txs.reduce((s, t) => s + netOf(t), 0);
          return (
            <div key={p.id} className="bg-white rounded-2xl border border-slate-100 p-4">
              <div className="flex items-start justify-between mb-2">
                <div>
                  <div className="font-semibold text-slate-800">{p.name}</div>
                  <div className="text-xs text-slate-400">{p.code} · {p.phone}</div>
                </div>
                <Badge tone={statTone[p.status]}>{p.status}</Badge>
              </div>
              <div className="text-xs text-slate-500 mb-3">{agentName(p.agentId)} · {p.bankName} {p.bankAccount}</div>
              <div className="flex items-center justify-between">
                <div className="text-xs text-slate-400">累计净输赢（{txs.length} 笔）</div>
                <NetAmount value={net} size="sm" />
              </div>
              <div className="flex gap-2 mt-3">
                <button onClick={() => setDetail(p)} className="flex-1 text-xs font-medium bg-slate-50 text-slate-600 py-2 rounded-lg flex items-center justify-center gap-1">
                  查看流水 <ChevronRight size={13} />
                </button>
                <button onClick={() => setEditing(p)} className="text-xs font-medium bg-slate-50 text-slate-600 px-3 py-2 rounded-lg">
                  <Edit2 size={13} />
                </button>
              </div>
            </div>
          );
        })}
        {list.length === 0 && <div className="col-span-2 text-center text-sm text-slate-400 py-10">没有符合条件的玩家</div>}
      </div>

      {(showAdd || editing) && (
        <PlayerFormModal
          player={editing}
          agents={agents}
          user={user}
          onClose={() => { setShowAdd(false); setEditing(null); }}
          onSave={(p) => {
            if (editing) {
              setPlayers((list) => list.map((x) => (x.id === p.id ? p : x)));
              flash("玩家资料已更新");
            } else {
              setPlayers((list) => [{ ...p, id: uid("P"), code: `PL-${String(list.length + 1).padStart(4, "0")}`, createdAt: todayStr() }, ...list]);
              flash("玩家已新增");
            }
            setShowAdd(false); setEditing(null);
          }}
        />
      )}

      {detail && (
        <Modal title={`${detail.name} 的流水`} onClose={() => setDetail(null)} wide>
          <PlayerHistory player={detail} transactions={transactions.filter((t) => t.playerId === detail.id)} netOf={netOf} />
        </Modal>
      )}
    </div>
  );
}

function PlayerFormModal({ player, agents, user, onClose, onSave }) {
  const [form, setForm] = useState(
    player || {
      name: "", phone: "", agentId: user.role === "agent" ? user.agentId : agents[0]?.id || "",
      bankName: "", bankAccount: "", status: "正常", remark: "", agentVisible: true,
    }
  );
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  return (
    <Modal title={player ? "修改玩家资料" : "新增玩家"} onClose={onClose}>
      <Field label="玩家姓名"><input className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
      <Field label="电话号码"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
      <Field label="所属代理">
        {user.role === "boss" ? (
          <select className={inputCls} value={form.agentId} onChange={(e) => set("agentId", e.target.value)}>
            {agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        ) : <div className={inputCls + " bg-slate-50 text-slate-500"}>{user.name}</div>}
      </Field>
      <div className="grid grid-cols-2 gap-x-3">
        <Field label="银行名称"><input className={inputCls} value={form.bankName} onChange={(e) => set("bankName", e.target.value)} /></Field>
        <Field label="银行账号"><input className={inputCls} value={form.bankAccount} onChange={(e) => set("bankAccount", e.target.value)} /></Field>
      </div>
      <Field label="状态">
        <select className={inputCls} value={form.status} onChange={(e) => set("status", e.target.value)}>
          {PLAYER_STATUS.map((s) => <option key={s}>{s}</option>)}
        </select>
      </Field>
      <Field label="备注"><input className={inputCls} value={form.remark} onChange={(e) => set("remark", e.target.value)} /></Field>
      <button
        onClick={() => { if (!form.name) return; onSave(form); }}
        className="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl text-sm mt-1"
      >
        保存
      </button>
    </Modal>
  );
}

function PlayerHistory({ transactions, netOf }) {
  const sum = (k) => transactions.reduce((s, t) => s + Number(t[k] || 0), 0);
  const net = transactions.reduce((s, t) => s + netOf(t), 0);
  return (
    <div>
      <div className="grid grid-cols-4 gap-2 mb-4 text-center">
        <MiniStat label="累计进款" value={fmt(sum("inAmount"))} />
        <MiniStat label="累计赢款" value={fmt(sum("outAmount"))} />
        <MiniStat label="累计FOC" value={fmt(sum("foc"))} tone="orange" />
        <MiniStat label="累计净输赢" value={<NetAmount value={net} />} raw />
      </div>
      <div className="divide-y divide-slate-100 max-h-72 overflow-y-auto">
        {transactions.sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : -1)).map((t) => (
          <div key={t.id} className="flex items-center justify-between py-2.5 text-sm">
            <span className="text-slate-500">{t.date} {t.time}</span>
            <span className="text-slate-500">进{fmt(t.inAmount)} / 赢{fmt(t.outAmount)}</span>
            <NetAmount value={netOf(t)} size="sm" />
          </div>
        ))}
        {transactions.length === 0 && <div className="text-center text-sm text-slate-400 py-8">暂无流水记录</div>}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// 代理输赢报表（老板专用）
// ---------------------------------------------------------------------------
function AgentReport({ agents, players, transactions, netOf, commissionOf, drillAgent, setDrillAgent }) {
  const [start, setStart] = useState(daysAgo(6));
  const [end, setEnd] = useState(todayStr());

  const rows = agents.map((a) => {
    const list = transactions.filter((t) => t.agentId === a.id && t.date >= start && t.date <= end);
    const inSum = list.reduce((s, t) => s + Number(t.inAmount), 0);
    const outSum = list.reduce((s, t) => s + Number(t.outAmount), 0);
    const focSum = list.reduce((s, t) => s + Number(t.foc), 0);
    const net = list.reduce((s, t) => s + netOf(t), 0);
    const commission = commissionOf(a.id, net);
    const lastTx = [...list].sort((x, y) => (x.date + x.time > y.date + y.time ? -1 : 1))[0];
    return {
      agent: a, count: list.length, players: new Set(list.map((t) => t.playerId)).size,
      inSum, outSum, focSum, net, commission, bossNet: net - commission, lastAt: lastTx ? `${lastTx.date} ${lastTx.time}` : "-",
    };
  });

  if (drillAgent) {
    const row = rows.find((r) => r.agent.id === drillAgent);
    const agentPlayers = players.filter((p) => p.agentId === drillAgent);
    const agentTx = transactions.filter((t) => t.agentId === drillAgent && t.date >= start && t.date <= end);
    return (
      <div className="space-y-4">
        <button onClick={() => setDrillAgent(null)} className="flex items-center gap-1.5 text-sm text-slate-500 font-medium">
          <ArrowLeft size={15} /> 返回代理报表
        </button>
        <h1 className="text-lg font-bold text-slate-800">{row.agent.name} 的明细</h1>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <StatCard label="玩家数量" value={row.players} tone="sky" />
          <StatCard label="账目数量" value={row.count} tone="slate" />
          <StatCard label="FOC" value={fmt(row.focSum)} tone="orange" />
          <StatCard label="净输赢" value={(row.net >= 0 ? "+" : "") + fmt(row.net)} tone={row.net >= 0 ? "green" : "red"} />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <StatCard label={`代理佣金（${row.agent.commissionRate ?? 0}%）`} value={fmt(row.commission)} tone="orange" />
          <StatCard label="老板实收" value={(row.bossNet >= 0 ? "+" : "") + fmt(row.bossNet)} tone={row.bossNet >= 0 ? "green" : "red"} />
        </div>

        <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
          <div className="px-4 py-3 border-b border-slate-100 font-semibold text-sm">名下玩家</div>
          <div className="divide-y divide-slate-100">
            {agentPlayers.map((p) => {
              const list = agentTx.filter((t) => t.playerId === p.id);
              const net = list.reduce((s, t) => s + netOf(t), 0);
              return (
                <div key={p.id} className="flex items-center justify-between px-4 py-3 text-sm">
                  <span>{p.name}（{list.length} 笔）</span>
                  <NetAmount value={net} size="sm" />
                </div>
              );
            })}
          </div>
        </div>

        <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
          <div className="px-4 py-3 border-b border-slate-100 font-semibold text-sm">全部流水</div>
          <div className="divide-y divide-slate-100 max-h-80 overflow-y-auto">
            {agentTx.sort((a, b) => (a.date + a.time < b.date + b.time ? 1 : -1)).map((t) => (
              <div key={t.id} className="flex items-center justify-between px-4 py-3 text-sm">
                <span className="text-slate-500">{t.date} {t.time} · {players.find((p) => p.id === t.playerId)?.name}</span>
                <NetAmount value={netOf(t)} size="sm" />
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      <h1 className="text-lg font-bold text-slate-800">代理输赢报表</h1>
      <div className="bg-white rounded-2xl border border-slate-100 p-4 flex gap-2.5">
        <input type="date" className={inputCls} value={start} onChange={(e) => setStart(e.target.value)} />
        <input type="date" className={inputCls} value={end} onChange={(e) => setEnd(e.target.value)} />
      </div>
      <div className="grid gap-3">
        {rows.map((row) => (
          <button
            key={row.agent.id}
            onClick={() => setDrillAgent(row.agent.id)}
            className="bg-white rounded-2xl border border-slate-100 p-4 flex items-center justify-between text-left hover:border-emerald-300"
          >
            <div>
              <div className="font-semibold text-slate-800">{row.agent.name}</div>
              <div className="text-xs text-slate-400 mt-0.5">{row.players} 位玩家 · {row.count} 笔账目 · 抽成 {row.agent.commissionRate ?? 0}% · 最后录入 {row.lastAt}</div>
              <div className="flex gap-3 mt-1.5 text-xs text-slate-500">
                <span>进款 {fmt(row.inSum)}</span><span>赢款 {fmt(row.outSum)}</span><span className="text-orange-600">FOC {fmt(row.focSum)}</span>
              </div>
              <div className="text-xs text-slate-500 mt-1">佣金 {fmt(row.commission)} · 老板实收 {fmt(row.bossNet)}</div>
            </div>
            <div className="flex items-center gap-2">
              <NetAmount value={row.net} />
              <ChevronRight size={16} className="text-slate-300" />
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function Expenses({ expenses, setExpenses, expenseCategories, setExpenseCategories, flash }) {
  const [start, setStart] = useState(daysAgo(6));
  const [end, setEnd] = useState(todayStr());
  const [category, setCategory] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  const list = expenses.filter((e) => {
    if (e.date < start || e.date > end) return false;
    if (category && e.category !== category) return false;
    return true;
  }).sort((a, b) => (a.date < b.date ? 1 : -1));

  const total = list.reduce((s, e) => s + Number(e.amount), 0);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h1 className="text-lg font-bold text-slate-800">老板开销</h1>
        <button onClick={() => setShowAdd(true)} className="text-xs font-semibold bg-emerald-600 text-white px-3.5 py-2 rounded-lg flex items-center gap-1.5">
          <PlusCircle size={14} /> 新增开销
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 p-4 grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <input type="date" className={inputCls} value={start} onChange={(e) => setStart(e.target.value)} />
        <input type="date" className={inputCls} value={end} onChange={(e) => setEnd(e.target.value)} />
        <select className={inputCls + " col-span-2 sm:col-span-1"} value={category} onChange={(e) => setCategory(e.target.value)}>
          <option value="">全部类型</option>
          {expenseCategories.map((c) => <option key={c}>{c}</option>)}
        </select>
        <div className="flex items-center justify-center bg-orange-50 rounded-xl text-orange-700 font-mono font-bold text-sm">
          总额 {fmt(total)}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 overflow-x-auto">
        <table className="w-full text-sm min-w-[600px]">
          <thead>
            <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
              <th className="px-4 py-3 font-medium">日期</th>
              <th className="px-4 py-3 font-medium">类型</th>
              <th className="px-4 py-3 font-medium">项目</th>
              <th className="px-4 py-3 font-medium">收款人</th>
              <th className="px-4 py-3 font-medium">金额</th>
              <th className="px-4 py-3 font-medium">操作</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-50">
            {list.map((e) => (
              <tr key={e.id} className="hover:bg-slate-50/60">
                <td className="px-4 py-3 text-slate-500">{e.date}</td>
                <td className="px-4 py-3"><Badge tone="amber">{e.category}</Badge></td>
                <td className="px-4 py-3">{e.item}</td>
                <td className="px-4 py-3 text-slate-500">{e.payee}</td>
                <td className="px-4 py-3 font-mono font-semibold text-orange-600">{fmt(e.amount)}</td>
                <td className="px-4 py-3">
                  <button
                    onClick={() => { setExpenses((l) => l.filter((x) => x.id !== e.id)); flash("已删除该开销"); }}
                    className="p-1.5 rounded-lg bg-red-50 text-red-500 hover:bg-red-100"
                  ><Trash2 size={13} /></button>
                </td>
              </tr>
            ))}
            {list.length === 0 && <tr><td colSpan={6} className="px-4 py-10 text-center text-slate-400">没有符合条件的开销记录</td></tr>}
          </tbody>
        </table>
      </div>

      {showAdd && (
        <ExpenseFormModal
          expenseCategories={expenseCategories}
          setExpenseCategories={setExpenseCategories}
          onClose={() => setShowAdd(false)}
          onSave={(e) => { setExpenses((l) => [{ ...e, id: uid("E"), createdBy: "老板", createdAt: `${e.date} ${nowTime()}` }, ...l]); setShowAdd(false); flash("开销已记录"); }}
        />
      )}
    </div>
  );
}

function ExpenseFormModal({ expenseCategories, setExpenseCategories, onClose, onSave }) {
  const [form, setForm] = useState({ date: todayStr(), category: expenseCategories[0], item: "", payee: "", paymentMethod: PAYMENT_METHODS[0], amount: 0, remark: "" });
  const [addingNew, setAddingNew] = useState(false);
  const [newCategory, setNewCategory] = useState("");
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const confirmNewCategory = () => {
    const name = newCategory.trim();
    if (!name) return;
    if (!expenseCategories.includes(name)) {
      setExpenseCategories((list) => [...list, name]);
    }
    set("category", name);
    setNewCategory("");
    setAddingNew(false);
  };

  return (
    <Modal title="新增开销" onClose={onClose}>
      <Field label="日期"><input type="date" className={inputCls} value={form.date} onChange={(e) => set("date", e.target.value)} /></Field>
      <Field label="开销类型">
        {addingNew ? (
          <div className="flex gap-2">
            <input
              autoFocus
              className={inputCls}
              value={newCategory}
              onChange={(e) => setNewCategory(e.target.value)}
              placeholder="输入新类型名称"
              onKeyDown={(e) => e.key === "Enter" && confirmNewCategory()}
            />
            <button onClick={confirmNewCategory} className="px-3 rounded-xl bg-emerald-600 text-white text-sm font-semibold shrink-0">确定</button>
            <button onClick={() => { setAddingNew(false); setNewCategory(""); }} className="px-3 rounded-xl bg-slate-100 text-slate-500 text-sm shrink-0">取消</button>
          </div>
        ) : (
          <select
            className={inputCls}
            value={form.category}
            onChange={(e) => {
              if (e.target.value === "__add_new__") { setAddingNew(true); return; }
              set("category", e.target.value);
            }}
          >
            {expenseCategories.map((c) => <option key={c}>{c}</option>)}
            <option value="__add_new__">＋ 新增类型…</option>
          </select>
        )}
      </Field>
      <Field label="开销项目"><input className={inputCls} value={form.item} onChange={(e) => set("item", e.target.value)} /></Field>
      <Field label="收款人 / 商家"><input className={inputCls} value={form.payee} onChange={(e) => set("payee", e.target.value)} /></Field>
      <Field label="金额"><input type="number" inputMode="decimal" className={inputCls} value={form.amount} onChange={(e) => set("amount", e.target.value)} /></Field>
      <button onClick={() => { if (!form.item) return; onSave(form); }} className="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl text-sm mt-1">保存</button>
    </Modal>
  );
}

// ---------------------------------------------------------------------------
// 代理管理：老板一键新增代理账号（真实调用 Supabase Edge Function）
// ---------------------------------------------------------------------------
function AgentManagement({ agents, setAgents, transactions, players, user, flash, netOf }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);

  const agentName = (id) => agents.find((a) => a.id === id)?.name || "-";

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h1 className="text-lg font-bold text-slate-800">代理管理</h1>
        <button onClick={() => setShowAdd(true)} className="text-xs font-semibold bg-emerald-600 text-white px-3.5 py-2 rounded-lg flex items-center gap-1.5">
          <PlusCircle size={14} /> 新增代理
        </button>
      </div>

      <div className="grid sm:grid-cols-2 gap-3">
        {agents.map((a) => {
          const players_ = players.filter((p) => p.agentId === a.id);
          const txs = transactions.filter((t) => t.agentId === a.id);
          const net = txs.reduce((s, t) => s + netOf(t), 0);
          return (
            <div key={a.id} className="bg-white rounded-2xl border border-slate-100 p-4">
              <div className="flex items-start justify-between mb-2">
                <div>
                  <div className="font-semibold text-slate-800">{a.name}</div>
                  <div className="text-xs text-slate-400">
                    {a.username ? `账号：${a.username}` : a.agent_code || a.id} · {a.phone || "无电话"} · 抽成 {a.commissionRate ?? 0}%
                  </div>
                  {a.remark ? <div className="text-xs text-slate-400 mt-0.5">备注：{a.remark}</div> : null}
                </div>
                <Badge tone={a.status === "正常" ? "green" : "slate"}>{a.status}</Badge>
              </div>
              <div className="flex items-center justify-between mt-3">
                <div className="text-xs text-slate-400">{players_.length} 位玩家 · {txs.length} 笔账目</div>
                <NetAmount value={net} size="sm" />
              </div>
              <button
                onClick={() => setEditing(a)}
                className="w-full mt-3 text-xs font-medium bg-slate-50 text-slate-600 py-2 rounded-lg flex items-center justify-center gap-1"
              >
                <Edit2 size={13} /> 编辑资料
              </button>
            </div>
          );
        })}
        {agents.length === 0 && <div className="col-span-2 text-center text-sm text-slate-400 py-10">还没有代理，点右上角新增</div>}
      </div>

      {showAdd && (
        <AddAgentModal
          user={user}
          onClose={() => setShowAdd(false)}
          onCreated={(agent) => {
            setAgents((list) => [...list, agent]);
            setShowAdd(false);
            flash(`代理账号 ${agent.username} 建好了`);
          }}
        />
      )}

      {editing && (
        <EditAgentModal
          agent={editing}
          onClose={() => setEditing(null)}
          onSave={(updated) => {
            setAgents((list) => list.map((a) => (a.id === updated.id ? updated : a)));
            setEditing(null);
            flash("代理资料已更新");
          }}
        />
      )}
    </div>
  );
}

function EditAgentModal({ agent, onClose, onSave }) {
  const [form, setForm] = useState({ ...agent });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  return (
    <Modal title="编辑代理资料" onClose={onClose}>
      <Field label="代理姓名"><input className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
      <Field label="登录账号">
        <input className={inputCls + " bg-slate-50 text-slate-500"} value={form.username || ""} disabled />
      </Field>
      <Field label="电话号码"><input className={inputCls} value={form.phone || ""} onChange={(e) => set("phone", e.target.value)} /></Field>
      <Field label="佣金比例（%）">
        <input
          type="number"
          inputMode="decimal"
          className={inputCls}
          value={form.commissionRate ?? 0}
          onChange={(e) => set("commissionRate", e.target.value)}
          placeholder="代理拿净输赢的百分之多少"
        />
      </Field>
      <Field label="状态">
        <select className={inputCls} value={form.status} onChange={(e) => set("status", e.target.value)}>
          <option value="正常">正常</option>
          <option value="停用">停用</option>
        </select>
      </Field>
      <Field label="备注（选填）"><input className={inputCls} value={form.remark || ""} onChange={(e) => set("remark", e.target.value)} /></Field>
      <button
        onClick={() => onSave({ ...form, commissionRate: Number(form.commissionRate) || 0 })}
        className="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl text-sm mt-1"
      >
        保存
      </button>
    </Modal>
  );
}

function AddAgentModal({ user, onClose, onCreated }) {
  const [form, setForm] = useState({ name: "", username: "", phone: "", password: "", remark: "", commissionRate: 20 });
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = async () => {
    setError("");
    if (!form.name || !form.username || !form.password) {
      setError("请填写姓名、账号和密码");
      return;
    }
    if (form.password.length < 6) {
      setError("密码至少 6 位");
      return;
    }
    setLoading(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-agent-account`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${user.accessToken}`,
        },
        body: JSON.stringify(form),
      });
      const data = await res.json();
      setLoading(false);
      if (!res.ok) {
        setError(data.error || "新增失败，请重试");
        return;
      }
      onCreated({
        id: data.agent_id,
        agent_code: data.agent_code,
        name: form.name,
        username: form.username,
        phone: form.phone,
        status: "正常",
        remark: form.remark,
        commissionRate: Number(form.commissionRate) || 0,
        createdAt: todayStr(),
      });
    } catch (e) {
      setLoading(false);
      setError("网络错误，请重试");
    }
  };

  return (
    <Modal title="新增代理账号" onClose={onClose}>
      <Field label="代理姓名"><input className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} placeholder="例如：阿明" /></Field>
      <Field label="登录账号"><input className={inputCls} value={form.username} onChange={(e) => set("username", e.target.value)} placeholder="代理登录用的账号" /></Field>
      <Field label="电话号码"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
      <Field label="佣金比例（%）"><input type="number" inputMode="decimal" className={inputCls} value={form.commissionRate} onChange={(e) => set("commissionRate", e.target.value)} placeholder="代理拿净输赢的百分之多少" /></Field>
      <Field label="登录密码"><input type="password" className={inputCls} value={form.password} onChange={(e) => set("password", e.target.value)} placeholder="至少 6 位，之后代理自己可改" /></Field>
      <Field label="备注（选填）"><input className={inputCls} value={form.remark} onChange={(e) => set("remark", e.target.value)} /></Field>
      {error ? <div className="text-red-500 text-xs mb-3 -mt-1">{error}</div> : null}
      <button
        onClick={submit}
        disabled={loading}
        className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-semibold py-3 rounded-xl text-sm"
      >
        {loading ? "新增中…" : "确认新增"}
      </button>
    </Modal>
  );
}

// ---------------------------------------------------------------------------
// 系统设置：修改自己的密码
// ---------------------------------------------------------------------------
function SettingsPage({ user, flash }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError("");
    if (newPassword.length < 6) {
      setError("新密码至少 6 位");
      return;
    }
    if (newPassword !== confirmPassword) {
      setError("两次输入的密码不一致");
      return;
    }
    setLoading(true);
    const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });
    setLoading(false);
    if (updateError) {
      setError("修改失败：" + updateError.message);
      return;
    }
    setNewPassword("");
    setConfirmPassword("");
    flash("密码已修改，下次登录请用新密码");
  };

  return (
    <div className="max-w-md space-y-5">
      <h1 className="text-lg font-bold text-slate-800">系统设置</h1>

      <div className="bg-white rounded-2xl border border-slate-100 p-5">
        <div className="text-xs font-semibold text-slate-400 mb-1">当前登录账号</div>
        <div className="text-sm font-medium text-slate-800 mb-5">{user.username || user.name}</div>

        <div className="text-sm font-semibold text-slate-700 mb-3">修改密码</div>
        <Field label="新密码">
          <input
            type="password"
            className={inputCls}
            value={newPassword}
            onChange={(e) => setNewPassword(e.target.value)}
            placeholder="至少 6 位"
          />
        </Field>
        <Field label="确认新密码">
          <input
            type="password"
            className={inputCls}
            value={confirmPassword}
            onChange={(e) => setConfirmPassword(e.target.value)}
            placeholder="再输入一次"
          />
        </Field>
        {error ? <div className="text-red-500 text-xs mb-3 -mt-1">{error}</div> : null}
        <button
          onClick={submit}
          disabled={loading}
          className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-semibold py-3 rounded-xl text-sm"
        >
          {loading ? "保存中…" : "保存新密码"}
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// 代理查看权限
// ---------------------------------------------------------------------------
function Permissions({ agents, players, setPlayers, transactions, setTransactions, flash }) {
  const [agentId, setAgentId] = useState(agents[0]?.id || "");
  const agentPlayers = players.filter((p) => p.agentId === agentId);
  const agentTx = transactions.filter((t) => t.agentId === agentId).sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 15);

  const togglePlayer = (id) => {
    setPlayers((list) => list.map((p) => (p.id === id ? { ...p, agentVisible: !p.agentVisible } : p)));
    flash("权限已更新，代理端会立即生效");
  };
  const toggleTx = (id) => {
    setTransactions((list) => list.map((t) => (t.id === id ? { ...t, agentVisible: !t.agentVisible } : t)));
    flash("权限已更新，代理端会立即生效");
  };

  return (
    <div className="space-y-4">
      <h1 className="text-lg font-bold text-slate-800">代理查看权限</h1>
      <div className="bg-white rounded-2xl border border-slate-100 p-4">
        <Field label="选择代理">
          <select className={inputCls} value={agentId} onChange={(e) => setAgentId(e.target.value)}>
            {agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        </Field>
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 font-semibold text-sm text-slate-700">玩家权限（关闭后代理看不到该玩家）</div>
        <div className="divide-y divide-slate-100">
          {agentPlayers.map((p) => (
            <div key={p.id} className="flex items-center justify-between px-4 py-3">
              <div>
                <div className="text-sm font-medium text-slate-800">{p.name}</div>
                <div className="text-xs text-slate-400">{p.code}</div>
              </div>
              <button
                onClick={() => togglePlayer(p.id)}
                className={`flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full ${p.agentVisible ? "bg-green-50 text-green-700" : "bg-slate-100 text-slate-400"}`}
              >
                {p.agentVisible ? <Eye size={13} /> : <EyeOff size={13} />}
                {p.agentVisible ? "可查看" : "已隐藏"}
              </button>
            </div>
          ))}
          {agentPlayers.length === 0 && <div className="px-4 py-6 text-center text-sm text-slate-400">该代理暂无玩家</div>}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 font-semibold text-sm text-slate-700">账目权限（最近 15 笔）</div>
        <div className="divide-y divide-slate-100 max-h-80 overflow-y-auto">
          {agentTx.map((t) => (
            <div key={t.id} className="flex items-center justify-between px-4 py-3">
              <div className="text-sm text-slate-600">{t.date} {t.time} · {players.find((p) => p.id === t.playerId)?.name}</div>
              <button
                onClick={() => toggleTx(t.id)}
                className={`flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full ${t.agentVisible ? "bg-green-50 text-green-700" : "bg-slate-100 text-slate-400"}`}
              >
                {t.agentVisible ? <Eye size={13} /> : <EyeOff size={13} />}
                {t.agentVisible ? "可查看" : "已隐藏"}
              </button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
